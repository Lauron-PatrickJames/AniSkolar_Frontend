<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AniSkolar | DLSU-D Scholarship Portal</title>
    <meta name="description" content="AniSkolar is the online scholarship portal of De La Salle University–Dasmariñas. Explore scholarships, check requirements, apply online and track your application with the Admissions and Scholarship Office." />
    <link rel="canonical" href="https://www.aniskolar.com/" />
    <meta name="theme-color" content="#006937" />

    <!-- Icons: browser tab, Google results, phone home screens -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Link previews (Facebook, Messenger, Teams, X) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AniSkolar" />
    <meta property="og:title" content="AniSkolar | DLSU-D Scholarship Portal" />
    <meta property="og:description" content="Explore DLSU-D scholarships, check requirements, apply online and track your application." />
    <meta property="og:url" content="https://www.aniskolar.com/" />
    <meta property="og:image" content="https://www.aniskolar.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="AniSkolar, the DLSU-D scholarship portal" />
    <meta property="og:locale" content="en_PH" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Tells Google the site's name ("AniSkolar" instead of the domain) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "AniSkolar",
        "alternateName": "AniSkolar DLSU-D Scholarship Portal",
        "url": "https://www.aniskolar.com/"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
